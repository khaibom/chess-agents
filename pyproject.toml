[project]
name = "chess-agents"
version = "0.1.0"
description = "Private preparation from completed chess games"
requires-python = ">=3.12,<3.13"
dependencies = ["chess", "httpx", "langgraph", "openai", "pydantic", "python-telegram-bot"]

[project.scripts]
chess-agents = "chess_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
